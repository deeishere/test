<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Frame in Frame — 3D Model</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', sans-serif;
      background: #D1FFBD;
      background-image:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.45) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(90,158,58,0.12) 0%, transparent 45%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1.25rem 2.5rem;
      color: #142410;
    }

    .app {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    header { text-align: center; }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(1.75rem, 5vw, 2.5rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
      color: #0f1a0c;
    }

    h1 span {
      display: block;
      font-family: 'Outfit', sans-serif;
      font-size: 0.42em;
      font-weight: 300;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #3d6b2e;
      margin-bottom: 0.35rem;
    }

    .stage {
      width: 100%;
      border-radius: 20px;
      overflow: hidden;
      background: #0a0a0a;
      box-shadow:
        0 2px 4px rgba(15, 26, 12, 0.06),
        0 24px 48px rgba(15, 26, 12, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    #output { display: block; width: 100%; height: auto; vertical-align: middle; }

    video { display: none; }

    .controls { display: flex; align-items: center; gap: 0.65rem; flex-wrap: wrap; justify-content: center; }

    button {
      font-family: 'Outfit', sans-serif;
      padding: 0.7rem 1.5rem;
      border: none;
      border-radius: 999px;
      background: #0f1a0c;
      color: #D1FFBD;
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
      box-shadow: 0 4px 14px rgba(15, 26, 12, 0.2);
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(15, 26, 12, 0.28); background: #1a2e14; }
    button:active { transform: translateY(0); }
    button:disabled { opacity: 0.5; cursor: default; transform: none; box-shadow: none; }

    button.delete {
      background: transparent;
      color: #5a3030;
      border: 1.5px solid rgba(90, 48, 48, 0.35);
      box-shadow: none;
    }
    button.delete:hover { background: rgba(255, 255, 255, 0.5); box-shadow: none; }

    .status {
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: #0f1a0c;
      min-height: 1.4em;
      text-align: center;
      padding: 0.35rem 0.75rem;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.55);
    }

    .tuning {
      width: 100%;
      background: rgba(255, 255, 255, 0.55);
      border-radius: 14px;
      padding: 0.6rem 1rem;
    }
    .tuning summary {
      cursor: pointer;
      font-weight: 500;
      letter-spacing: 0.02em;
      padding: 0.3rem 0;
    }
    .tuning-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 0.7rem 1.2rem;
      margin-top: 0.6rem;
    }
    .tuning-grid label {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      font-size: 0.8rem;
      color: #3d6b2e;
    }
    .tuning-grid input[type="range"] {
      width: 100%;
    }
    .tuning-grid span {
      font-size: 0.75rem;
      color: #142410;
      font-weight: 500;
    }
    .tuning-grid button {
      align-self: end;
      padding: 0.4rem 1rem;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1><span>Welcome to</span>Frame in Frame — 3D Model</h1>
    </header>

    <div class="stage">
      <canvas id="output" width="1280" height="720"></canvas>
    </div>

    <div class="controls">
      <button type="button" id="btnStart" style="background: #3d6b2e; color: white;" disabled>Loading…</button>
      <button type="button" id="btnUpload">Upload Model</button>
      <button type="button" id="btnDelete" class="delete">Reset</button>
      <input type="file" id="fileInput" accept=".glb,.gltf" hidden />
    </div>

    <details class="tuning">
      <summary>Adjust model fit</summary>
      <div class="tuning-grid">
        <label>Scale
          <input type="range" id="sldScale" min="0.1" max="2" step="0.01" value="1" />
          <span id="valScale">1.00×</span>
        </label>
        <label>X offset
          <input type="range" id="sldPosX" min="-100" max="100" step="1" value="0" />
          <span id="valPosX">0</span>
        </label>
        <label>Y offset
          <input type="range" id="sldPosY" min="-100" max="100" step="1" value="0" />
          <span id="valPosY">0</span>
        </label>
        <label>Z offset
          <input type="range" id="sldPosZ" min="-100" max="100" step="1" value="0" />
          <span id="valPosZ">0</span>
        </label>
        <label>Rotate X
          <input type="range" id="sldRotX" min="-180" max="180" step="1" value="0" />
          <span id="valRotX">0°</span>
        </label>
        <label>Rotate Y
          <input type="range" id="sldRotY" min="-180" max="180" step="1" value="0" />
          <span id="valRotY">0°</span>
        </label>
        <label>Rotate Z
          <input type="range" id="sldRotZ" min="-180" max="180" step="1" value="0" />
          <span id="valRotZ">0°</span>
        </label>
        <button type="button" id="btnResetTuning" class="delete">Reset sliders</button>
      </div>
    </details>

    <p class="status" id="status">Loading face tracker…</p>
  </div>

  <video id="webcam" autoplay muted playsinline></video>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    // ---------- constants ----------
    const canvas = document.getElementById('output');
    const ctx = canvas.getContext('2d');
    const webcam = document.getElementById('webcam');
    const fileInput = document.getElementById('fileInput');
    const statusEl = document.getElementById('status');
    const btnStart = document.getElementById('btnStart');

    const W = canvas.width;
    const H = canvas.height;

    // Put your own model next to this file with this name, or use the
    // Upload Model button. .glb is strongly recommended (single file,
    // no separate texture/bin references to go missing).
    const DEFAULT_MODEL_URL = 'spider.glb';

    // Approximate human head width, in the canonical face model's units,
    // that the loaded model gets auto-scaled to fit. Most downloaded
    // models are wildly different native sizes, so this does the heavy
    // lifting automatically — MODEL_SCALE below is just a multiplier on
    // top of that for fine adjustment.
    const TARGET_HEAD_WIDTH = 180;

    // Fine-tuning knobs — every model is authored at a different scale/
    // orientation, so you'll likely need to nudge these by eye once you
    // have a real asset loaded. These are live-editable via the "Adjust
    // model fit" sliders in the UI. Rotation is in degrees.
    let modelScale = 1.0;
    let modelPositionOffset = { x: 0, y: 0, z: 0 };
    let modelRotationOffsetDeg = { x: 0, y: 0, z: 0 };

    // MediaPipe's face-geometry virtual camera convention: the facial
    // transformation matrix is designed to be used with a perspective
    // camera at the origin looking down -Z, using these defaults from
    // MediaPipe's face_geometry environment config. If the mesh looks
    // too big/small for your webcam's actual FOV, tune this value.
    const VERTICAL_FOV_DEGREES = 63;
    const NEAR = 1;
    const FAR = 10000;

    const FACE_LANDMARKER_MODEL_URL =
      'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
    const TASKS_VISION_WASM_URL =
      'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';

    // ---------- state ----------
    let faceLandmarker = null;
    let trackingActive = false;
    let processingFrame = false;
    let cameraStream = null;
    let lastMatrixData = null;
    let faceLostTime = 0;
    const RECOVERY_TIMEOUT = 1000; // ms
    let t0 = performance.now();

    function setStatus(msg) { statusEl.textContent = msg || ' '; }

    // ---------- mirrored webcam buffer (also fed to the landmarker so
    // landmark coords line up with the mirrored/selfie-view picture) ----------
    const mirrorCanvas = document.createElement('canvas');
    mirrorCanvas.width = W;
    mirrorCanvas.height = H;
    const mirrorCtx = mirrorCanvas.getContext('2d');

    function updateMirrorCanvas() {
      if (webcam.readyState < HTMLMediaElement.HAVE_CURRENT_DATA) return false;
      mirrorCtx.save();
      mirrorCtx.scale(-1, 1);
      mirrorCtx.drawImage(webcam, -W, 0, W, H);
      mirrorCtx.restore();
      return true;
    }

    function drawWebcamFrame() {
      ctx.drawImage(mirrorCanvas, 0, 0, W, H);
    }

    function drawCanvasHint(text) {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
      ctx.fillRect(0, H - 52, W, 52);
      ctx.fillStyle = '#D1FFBD';
      ctx.font = '500 20px Outfit, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(text, W / 2, H - 20);
      ctx.textAlign = 'left';
    }

    // ---------- three.js scene ----------
    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(W, H);
    renderer.setClearColor(0x000000, 0);
    if ('outputColorSpace' in renderer) renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    const camera3d = new THREE.PerspectiveCamera(VERTICAL_FOV_DEGREES, W / H, NEAR, FAR);
    // default three.js camera already looks down -Z with +Y up — matches
    // the coordinate convention the transformation matrix expects.

    // Basic lighting, since a real model's materials likely aren't unlit
    // like the old flat texture-on-canonical-mesh was.
    scene.add(new THREE.HemisphereLight(0xffffff, 0x404040, 1.4));
    const keyLight = new THREE.DirectionalLight(0xffffff, 1.1);
    keyLight.position.set(0.5, 1, 1);
    scene.add(keyLight);

    // Anchor object driven every frame by the Face Landmarker's head-pose
    // matrix. Whatever model is currently mounted sits inside a wrapper
    // Group that we auto-fit + let you fine-tune, as a child of this.
    const anchor = new THREE.Object3D();
    anchor.matrixAutoUpdate = false;
    scene.add(anchor);

    let currentWrapper = null;
    let baseAutoScale = 1;
    let userBlobUrl = null;

    function disposeObject(obj) {
      obj.traverse((node) => {
        if (node.isMesh) {
          node.geometry?.dispose();
          const mats = Array.isArray(node.material) ? node.material : [node.material];
          mats.forEach((m) => {
            if (!m) return;
            Object.values(m).forEach((v) => { if (v && v.isTexture) v.dispose(); });
            m.dispose();
          });
        }
      });
    }

    // Applies the current scale/position/rotation knobs to whatever is
    // mounted right now. Called on mount, and live from the sliders.
    function applyWrapperTransform() {
      if (!currentWrapper) return;
      currentWrapper.scale.setScalar(baseAutoScale * modelScale);
      currentWrapper.rotation.set(
        THREE.MathUtils.degToRad(modelRotationOffsetDeg.x),
        THREE.MathUtils.degToRad(modelRotationOffsetDeg.y),
        THREE.MathUtils.degToRad(modelRotationOffsetDeg.z)
      );
      currentWrapper.position.set(modelPositionOffset.x, modelPositionOffset.y, modelPositionOffset.z);
    }

    // Wraps whatever object is passed in, auto-fits it to roughly head-
    // sized, applies the manual calibration knobs, and swaps it in as the
    // thing riding on the face anchor.
    function mountObject(object3d) {
      if (currentWrapper) {
        anchor.remove(currentWrapper);
        disposeObject(currentWrapper);
      }

      const box = new THREE.Box3().setFromObject(object3d);
      const size = new THREE.Vector3();
      box.getSize(size);
      const center = new THREE.Vector3();
      box.getCenter(center);
      const maxDim = Math.max(size.x, size.y, size.z) || 1;
      baseAutoScale = TARGET_HEAD_WIDTH / maxDim;

      object3d.position.sub(center); // recenter the model at its own origin

      const wrapper = new THREE.Group();
      wrapper.add(object3d);
      anchor.add(wrapper);
      currentWrapper = wrapper;
      applyWrapperTransform();
      checkReady();
    }

    // Generic placeholder — plain geometric shapes only, so it's obviously
    // a stand-in rather than any particular character, until you mount a
    // real model.
    function buildPlaceholder() {
      const group = new THREE.Group();
      const shellMat = new THREE.MeshStandardMaterial({ color: 0x1a2e14, roughness: 0.5 });
      const accentMat = new THREE.MeshStandardMaterial({ color: 0x52e0c4, roughness: 0.3, emissive: 0x0c1a16 });

      const shell = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 24, 0, Math.PI * 2, 0, Math.PI * 0.62), shellMat);
      shell.scale.set(1, 1.15, 0.85);
      group.add(shell);

      const eyeGeo = new THREE.SphereGeometry(0.22, 20, 16);
      const eyeL = new THREE.Mesh(eyeGeo, accentMat);
      eyeL.position.set(-0.35, 0.05, 0.72);
      const eyeR = eyeL.clone();
      eyeR.position.x = 0.35;
      group.add(eyeL, eyeR);

      return group;
    }

    function loadDefaultModel() {
      revokeUserBlob();
      fileInput.value = '';
      setStatus('Looking for ' + DEFAULT_MODEL_URL + '…');
      new GLTFLoader().load(
        DEFAULT_MODEL_URL,
        (gltf) => {
          mountObject(gltf.scene);
          setStatus(DEFAULT_MODEL_URL);
        },
        undefined,
        () => {
          // No spider.glb present — fall back to the placeholder so the
          // rig is still visibly working.
          mountObject(buildPlaceholder());
          setStatus('No spider.glb found — showing placeholder. Use Upload Model.');
        }
      );
    }

    function uploadModelFile(file) {
      if (!file) return;
      revokeUserBlob();
      const url = URL.createObjectURL(file);
      userBlobUrl = url;
      setStatus('Loading ' + file.name + '…');
      new GLTFLoader().load(
        url,
        (gltf) => {
          mountObject(gltf.scene);
          setStatus(file.name);
        },
        undefined,
        (err) => {
          console.error('Model load failed:', err);
          setStatus('Failed to load that file — is it a valid .glb/.gltf?');
        }
      );
    }

    function revokeUserBlob() {
      if (userBlobUrl) { URL.revokeObjectURL(userBlobUrl); userBlobUrl = null; }
    }

    // ---------- live tuning sliders ----------
    const sliderConfig = [
      { id: 'sldScale', valId: 'valScale', get: () => modelScale, set: (v) => { modelScale = v; }, fmt: (v) => v.toFixed(2) + '×' },
      { id: 'sldPosX', valId: 'valPosX', get: () => modelPositionOffset.x, set: (v) => { modelPositionOffset.x = v; }, fmt: (v) => Math.round(v) },
      { id: 'sldPosY', valId: 'valPosY', get: () => modelPositionOffset.y, set: (v) => { modelPositionOffset.y = v; }, fmt: (v) => Math.round(v) },
      { id: 'sldPosZ', valId: 'valPosZ', get: () => modelPositionOffset.z, set: (v) => { modelPositionOffset.z = v; }, fmt: (v) => Math.round(v) },
      { id: 'sldRotX', valId: 'valRotX', get: () => modelRotationOffsetDeg.x, set: (v) => { modelRotationOffsetDeg.x = v; }, fmt: (v) => Math.round(v) + '°' },
      { id: 'sldRotY', valId: 'valRotY', get: () => modelRotationOffsetDeg.y, set: (v) => { modelRotationOffsetDeg.y = v; }, fmt: (v) => Math.round(v) + '°' },
      { id: 'sldRotZ', valId: 'valRotZ', get: () => modelRotationOffsetDeg.z, set: (v) => { modelRotationOffsetDeg.z = v; }, fmt: (v) => Math.round(v) + '°' },
    ];

    function wireSliders() {
      sliderConfig.forEach((cfg) => {
        const input = document.getElementById(cfg.id);
        const valSpan = document.getElementById(cfg.valId);
        input.value = cfg.get();
        valSpan.textContent = cfg.fmt(cfg.get());
        input.addEventListener('input', () => {
          const v = parseFloat(input.value);
          cfg.set(v);
          valSpan.textContent = cfg.fmt(v);
          applyWrapperTransform();
        });
      });

      document.getElementById('btnResetTuning').addEventListener('click', () => {
        modelScale = 1.0;
        modelPositionOffset = { x: 0, y: 0, z: 0 };
        modelRotationOffsetDeg = { x: 0, y: 0, z: 0 };
        sliderConfig.forEach((cfg) => {
          const input = document.getElementById(cfg.id);
          const valSpan = document.getElementById(cfg.valId);
          input.value = cfg.get();
          valSpan.textContent = cfg.fmt(cfg.get());
        });
        applyWrapperTransform();
      });
    }
    wireSliders();

    // ---------- face landmarker readiness ----------
    let landmarkerReady = false;

    function checkReady() {
      if (landmarkerReady) {
        btnStart.disabled = false;
        btnStart.textContent = 'Start Camera';
        setStatus('Click Start Camera');
        drawCanvasHint('Click Start Camera below');
      }
    }

    document.getElementById('btnUpload').addEventListener('click', () => fileInput.click());
    document.getElementById('btnDelete').addEventListener('click', loadDefaultModel);
    fileInput.addEventListener('change', (e) => uploadModelFile(e.target.files[0]));

    // Mount the placeholder immediately so the rig is testable right away,
    // then try to replace it with spider.glb if one exists.
    mountObject(buildPlaceholder());
    loadDefaultModel();

    async function initFaceLandmarker() {
      try {
        const filesetResolver = await FilesetResolver.forVisionTasks(TASKS_VISION_WASM_URL);
        try {
          faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
            baseOptions: { modelAssetPath: FACE_LANDMARKER_MODEL_URL, delegate: 'GPU' },
            outputFaceBlendshapes: false,
            outputFacialTransformationMatrixes: true,
            runningMode: 'VIDEO',
            numFaces: 1,
          });
        } catch (gpuErr) {
          console.warn('GPU delegate failed, retrying on CPU:', gpuErr);
          faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
            baseOptions: { modelAssetPath: FACE_LANDMARKER_MODEL_URL, delegate: 'CPU' },
            outputFaceBlendshapes: false,
            outputFacialTransformationMatrixes: true,
            runningMode: 'VIDEO',
            numFaces: 1,
          });
        }
        landmarkerReady = true;
        checkReady();
      } catch (err) {
        console.error('Face Landmarker init failed:', err);
        setStatus(`Tracking unavailable: ${err.message || err}`);
      }
    }

    initFaceLandmarker();

    // ---------- camera ----------
    function isSecureContext() { return window.isSecureContext; }

    async function startCamera() {
      if (!navigator.mediaDevices?.getUserMedia) {
        setStatus('Camera API unavailable — open via http://localhost, not file://');
        return;
      }
      if (!isSecureContext()) {
        setStatus('Camera needs HTTPS or localhost — run: python3 -m http.server');
        return;
      }
      try {
        setStatus('Starting camera…');
        btnStart.disabled = true;
        if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());

        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: W }, height: { ideal: H } },
          audio: false,
        });

        webcam.srcObject = cameraStream;
        await webcam.play();

        btnStart.style.display = 'none';
        trackingActive = true;
        setStatus('Camera on — show your face');
        requestAnimationFrame(processCameraFrame);
      } catch (err) {
        console.error('Camera start failed:', err);
        btnStart.disabled = false;
        if (err.name === 'NotAllowedError') setStatus('Camera blocked — allow access in browser settings');
        else if (err.name === 'NotFoundError') setStatus('No camera found on this device');
        else setStatus(`Camera error: ${err.message || err.name}`);
      }
    }
    btnStart.addEventListener('click', startCamera);

    // ---------- per-frame processing ----------
    async function processCameraFrame() {
      if (!trackingActive) return;

      const hasFrame = updateMirrorCanvas();
      drawWebcamFrame();

      if (faceLandmarker && hasFrame && !processingFrame && currentWrapper) {
        processingFrame = true;
        try {
          const results = faceLandmarker.detectForVideo(mirrorCanvas, performance.now());
          const matrices = results.facialTransformationMatrixes;

          if (matrices && matrices.length > 0) {
            lastMatrixData = matrices[0].data;
            faceLostTime = 0;
            applyTransformAndRender();
            setStatus('Face tracked');
          } else if (lastMatrixData && faceLostTime === 0) {
            faceLostTime = performance.now();
            applyTransformAndRender();
          } else if (lastMatrixData && performance.now() - faceLostTime < RECOVERY_TIMEOUT) {
            applyTransformAndRender();
          } else {
            lastMatrixData = null;
            drawCanvasHint('Show your face to the camera');
            setStatus('Camera on — show your face');
          }
        } catch (error) {
          console.error('Face Landmarker frame error:', error);
          setStatus(`Tracking error: ${error.message || error}`);
        } finally {
          processingFrame = false;
        }
      } else if (!currentWrapper) {
        drawCanvasHint('Loading model…');
      }

      requestAnimationFrame(processCameraFrame);
    }

    function applyTransformAndRender() {
      anchor.matrix.fromArray(lastMatrixData);
      anchor.matrixWorldNeedsUpdate = true;
      renderer.render(scene, camera3d);
      ctx.drawImage(renderer.domElement, 0, 0, W, H);
    }

    // ---------- startup hints ----------
    if (!isSecureContext()) {
      setStatus('Open via http://localhost:8080/ (not file://)');
      drawCanvasHint('Use a local server, then click Start Camera');
    } else {
      drawCanvasHint('Loading model…');
    }
  </script>
</body>
</html>
