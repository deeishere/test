<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Frame in Frame</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', sans-serif;
      background: #D1FFBD;
      background-image:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.45) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(90,158,58,0.12) 0%, transparent 45%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1.25rem 2.5rem;
      color: #142410;
    }

    .app {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    header {
      text-align: center;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(1.75rem, 5vw, 2.5rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
      color: #0f1a0c;
    }

    h1 span {
      display: block;
      font-family: 'Outfit', sans-serif;
      font-size: 0.42em;
      font-weight: 300;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #3d6b2e;
      margin-bottom: 0.35rem;
    }

    .stage {
      width: 100%;
      border-radius: 20px;
      overflow: hidden;
      background: #0a0a0a;
      box-shadow:
        0 2px 4px rgba(15, 26, 12, 0.06),
        0 24px 48px rgba(15, 26, 12, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    #output {
      display: block;
      width: 100%;
      height: auto;
      vertical-align: middle;
    }

    video, #innerVideo { display: none; }

    .controls {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      font-family: 'Outfit', sans-serif;
      padding: 0.7rem 1.5rem;
      border: none;
      border-radius: 999px;
      background: #0f1a0c;
      color: #D1FFBD;
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
      box-shadow: 0 4px 14px rgba(15, 26, 12, 0.2);
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(15, 26, 12, 0.28);
      background: #1a2e14;
    }

    button:active { transform: translateY(0); }

    button.delete {
      background: transparent;
      color: #5a3030;
      border: 1.5px solid rgba(90, 48, 48, 0.35);
      box-shadow: none;
    }

    button.delete:hover {
      background: rgba(255, 255, 255, 0.5);
      box-shadow: none;
    }

    .status {
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: #0f1a0c;
      min-height: 1.4em;
      text-align: center;
      padding: 0.35rem 0.75rem;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.55);
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1><span>Welcome to</span>Frame in Frame!</h1>
    </header>

    <div class="stage">
      <canvas id="output" width="1280" height="720"></canvas>
    </div>

    <div class="controls">
      <button type="button" id="btnStart" style="background: #3d6b2e; color: white;">Start Camera</button>
      <button type="button" id="btnUpload">Upload</button>
      <button type="button" id="btnDelete" class="delete">Delete</button>
      <input type="file" id="fileInput" accept="image/*,video/*" hidden />
    </div>

    <p class="status" id="status">Loading…</p>
  </div>

  <video id="webcam" autoplay muted playsinline></video>
  <video id="innerVideo" playsinline loop muted></video>
  <img id="innerImage" src="spider.png" alt="" hidden />

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/face_mesh.js" crossorigin="anonymous"></script>

  <script>
    // Console logging to help debug
    console.log("Script starting...");

    const canvas = document.getElementById('output');
    const ctx = canvas.getContext('2d');
    const webcam = document.getElementById('webcam');
    const innerVideo = document.getElementById('innerVideo');
    const innerImage = document.getElementById('innerImage');
    const fileInput = document.getElementById('fileInput');
    const statusEl = document.getElementById('status');

    const W = canvas.width;
    const H = canvas.height;

    const DEFAULT_INNER = 'spider.jpg';

    let innerKind = 'image'; // image | video
    let userBlobUrl = null;
    let smoothed = null;
    let currentFaceTransform = null;
    let lastFaceTransform = null;
    let lastSilhouette = null;
    let faceLostTime = 0;
    const RECOVERY_TIMEOUT = 1000; // ms
    let t0 = performance.now();

    const FACE_OUTLINE = [
      10, 338, 297, 332, 284, 251, 389, 356, 454, 323, 361, 288, 397, 365, 379, 378,
      400, 377, 152, 148, 176, 149, 150, 136, 172, 58, 132, 93, 234, 127, 162, 21,
      54, 103, 67, 109
    ];

    const LM_LEFT_CHEEK = 234;
    const LM_RIGHT_CHEEK = 454;
    const LM_FOREHEAD = 10;
    const LM_CHIN = 152;
    const LM_LEFT_EYE_OUTER = 33;
    const LM_RIGHT_EYE_OUTER = 263;

    function getFaceFrameCorners(landmarks, w, h, margin = 1.45) {
      function pt(idx) {
        const lm = landmarks[idx];
        return [lm.x * w, lm.y * h];
      }

      const leftCheek = pt(LM_LEFT_CHEEK);
      const rightCheek = pt(LM_RIGHT_CHEEK);
      const forehead = pt(LM_FOREHEAD);
      const chin = pt(LM_CHIN);
      const leftEye = pt(LM_LEFT_EYE_OUTER);
      const rightEye = pt(LM_RIGHT_EYE_OUTER);

      const center = [
        (leftCheek[0] + rightCheek[0] + forehead[0] + chin[0]) / 4,
        (leftCheek[1] + rightCheek[1] + forehead[1] + chin[1]) / 4,
      ];

      const faceWidth = Math.sqrt(Math.pow(rightCheek[0] - leftCheek[0], 2) + Math.pow(rightCheek[1] - leftCheek[1], 2)) * margin;
      const faceHeight = Math.sqrt(Math.pow(chin[0] - forehead[0], 2) + Math.pow(chin[1] - forehead[1], 2)) * margin;

      const dx = rightEye[0] - leftEye[0];
      const dy = rightEye[1] - leftEye[1];
      const angle = Math.atan2(dy, dx);

      const hw = faceWidth / 2;
      const hh = faceHeight / 2;

      const local = [
        [-hw, -hh], // TL
        [hw, -hh],  // TR
        [hw, hh],   // BR
        [-hw, hh],  // BL
      ];

      const cos = Math.cos(angle);
      const sin = Math.sin(angle);

      const corners = local.map(p => [
        p[0] * cos - p[1] * sin + center[0],
        p[0] * sin + p[1] * cos + center[1],
      ]);

      return { corners, center, angle, faceWidth, faceHeight };
    }

    function lerpPolygon(prev, target, t) {
      return prev.map((p, i) => [
        p[0] + (target[i][0] - p[0]) * t,
        p[1] + (target[i][1] - p[1]) * t,
      ]);
    }

    function polygonArea(pts) {
      let area = 0;
      for (let i = 0; i < pts.length; i++) {
        const j = (i + 1) % pts.length;
        area += pts[i][0] * pts[j][1] - pts[j][0] * pts[i][1];
      }
      return Math.abs(area) / 2;
    }

    function coverCrop(source, tw, th) {
      const off = document.createElement('canvas');
      off.width = tw;
      off.height = th;
      const octx = off.getContext('2d');
      const sw = source.videoWidth || source.naturalWidth || source.width;
      const sh = source.videoHeight || source.naturalHeight || source.height;
      if (!sw || !sh) return off;
      const scale = Math.max(tw / sw, th / sh);
      const nw = Math.ceil(sw * scale);
      const nh = Math.ceil(sh * scale);
      const x0 = (nw - tw) / 2;
      const y0 = (nh - th) / 2;
      octx.drawImage(source, -x0, -y0, nw, nh);
      return off;
    }

    function placeholderTile(w, h, t) {
      const off = document.createElement('canvas');
      off.width = w;
      off.height = h;
      const octx = off.getContext('2d');
      octx.fillStyle = '#101010';
      octx.fillRect(0, 0, w, h);
      const stripeW = 18;
      const shift = (Math.floor(t * 40) % (stripeW * 2));
      octx.fillStyle = '#52e0c4';
      for (let x = -h - shift; x < w; x += stripeW * 2) {
        octx.beginPath();
        octx.moveTo(x, h);
        octx.lineTo(x + h, 0);
        octx.lineTo(x + h + stripeW, 0);
        octx.lineTo(x + stripeW, h);
        octx.closePath();
        octx.fill();
      }
      octx.globalAlpha = 0.18;
      octx.fillStyle = '#52e0c4';
      octx.fillRect(0, 0, w, h);
      return off;
    }

    function getInnerFrame(w, h, t) {
      if (innerKind === 'video' && innerVideo.readyState >= 2) {
        return coverCrop(innerVideo, w, h);
      }
      if (innerImage.complete && innerImage.naturalWidth) {
        return coverCrop(innerImage, w, h);
      }
      return placeholderTile(w, h, t);
    }

    // --- inner content upload / delete ---

    function revokeUserBlob() {
      if (userBlobUrl) {
        URL.revokeObjectURL(userBlobUrl);
        userBlobUrl = null;
      }
    }

    function loadDefaultInner() {
      revokeUserBlob();
      innerKind = 'image';
      innerVideo.pause();
      innerVideo.removeAttribute('src');
      innerImage.src = DEFAULT_INNER;
      fileInput.value = '';
      setStatus('');
    }

    function uploadInnerFile(file) {
      if (!file) return;
      revokeUserBlob();
      const url = URL.createObjectURL(file);
      userBlobUrl = url;
      if (file.type.startsWith('video/')) {
        innerKind = 'video';
        innerVideo.src = url;
        innerVideo.play().catch(() => {});
        setStatus(file.name);
      } else if (file.type.startsWith('image/')) {
        innerKind = 'image';
        innerImage.onload = () => setStatus(file.name);
        innerImage.src = url;
      } else {
        revokeUserBlob();
        setStatus('Unsupported file');
      }
    }

    function deleteInnerContent() {
      loadDefaultInner();
    }

    function setStatus(msg) {
      statusEl.textContent = msg || ' ';
    }

    function drawCanvasHint(text) {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
      ctx.fillRect(0, H - 52, W, 52);
      ctx.fillStyle = '#D1FFBD';
      ctx.font = '500 20px Outfit, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(text, W / 2, H - 20);
      ctx.textAlign = 'left';
    }

    let faceMesh = null;

    try {
      if (typeof FaceMesh === 'undefined') {
        throw new Error('MediaPipe FaceMesh script did not load');
      }

      faceMesh = new FaceMesh({
        locateFile: (file) =>
          `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/${file}`,
      });

      faceMesh.setOptions({
        maxNumFaces: 1,
        refineLandmarks: false,
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.5,
      });
    } catch (error) {
      console.error('MediaPipe init failed:', error);
      setStatus(`Tracking unavailable: ${error.message}`);
    }

    let trackingActive = false;
    let processingFrame = false;
    let cameraStream = null;

    // Mirrored offscreen buffer: we flip the webcam once into this canvas and
    // use it both for display AND as the image MediaPipe tracks, so landmark
    // coordinates already match the mirrored (selfie-view) picture — the same
    // approach testracker.py uses (cv2.flip before face_mesh.process). This
    // avoids mismatched/inconsistent flips between the video and the frame.
    const mirrorCanvas = document.createElement('canvas');
    mirrorCanvas.width = W;
    mirrorCanvas.height = H;
    const mirrorCtx = mirrorCanvas.getContext('2d');

    function isSecureContext() {
      return window.isSecureContext;
    }

    function updateMirrorCanvas() {
      if (webcam.readyState < HTMLMediaElement.HAVE_CURRENT_DATA) return false;
      mirrorCtx.save();
      mirrorCtx.scale(-1, 1);
      mirrorCtx.drawImage(webcam, -W, 0, W, H);
      mirrorCtx.restore();
      return true;
    }

    function drawWebcamFrame() {
      ctx.drawImage(mirrorCanvas, 0, 0, W, H);
    }

    async function startCamera() {
      if (!navigator.mediaDevices?.getUserMedia) {
        setStatus('Camera API unavailable — open via http://localhost, not file://');
        return;
      }

      if (!isSecureContext()) {
        setStatus('Camera needs HTTPS or localhost — run: python3 -m http.server');
        return;
      }

      try {
        setStatus('Starting camera…');
        btnStart.disabled = true;

        if (cameraStream) {
          cameraStream.getTracks().forEach(track => track.stop());
        }

        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: 'user',
            width: { ideal: W },
            height: { ideal: H },
          },
          audio: false,
        });

        webcam.srcObject = cameraStream;
        await webcam.play();

        btnStart.style.display = 'none';
        trackingActive = true;
        setStatus('Camera on — show your face');
        requestAnimationFrame(processCameraFrame);
      } catch (err) {
        console.error('Camera start failed:', err);
        btnStart.disabled = false;
        if (err.name === 'NotAllowedError') {
          setStatus('Camera blocked — allow access in browser settings');
        } else if (err.name === 'NotFoundError') {
          setStatus('No camera found on this device');
        } else {
          setStatus(`Camera error: ${err.message || err.name}`);
        }
      }
    }

    async function processCameraFrame() {
      if (!trackingActive) return;

      const hasFrame = updateMirrorCanvas();
      drawWebcamFrame();

      if (faceMesh && hasFrame && !processingFrame) {
        processingFrame = true;
        try {
          // Send the already-mirrored canvas, not the raw webcam element, so
          // landmark x/y line up directly with what's drawn on screen.
          await faceMesh.send({ image: mirrorCanvas });
        } catch (error) {
          console.error('MediaPipe frame error:', error);
          setStatus(`Tracking error: ${error.message || error}`);
        } finally {
          processingFrame = false;
        }
      } else if (!faceMesh) {
        drawCanvasHint('Camera on — tracking model not loaded');
      }

      requestAnimationFrame(processCameraFrame);
    }

    // --- event listeners ---

    const btnStart = document.getElementById('btnStart');

    btnStart.addEventListener('click', startCamera);

    document.getElementById('btnUpload').addEventListener('click', () => fileInput.click());
    document.getElementById('btnDelete').addEventListener('click', deleteInnerContent);
    fileInput.addEventListener('change', (e) => uploadInnerFile(e.target.files[0]));

    // --- compositing ---

    function drawPolygonMask(points) {
      ctx.beginPath();
      ctx.moveTo(points[0][0], points[0][1]);
      for (let i = 1; i < points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
      ctx.closePath();
    }

    function drawSilhouetteMask(points) {
      if (!points || points.length === 0) return;
      ctx.beginPath();
      ctx.moveTo(points[0][0], points[0][1]);
      for (let i = 1; i < points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
      ctx.closePath();
    }

    function compositeFrame(polyData, silhouette, t) {
      const poly = polyData.corners;
      const { center, angle, faceWidth, faceHeight } = polyData;

      ctx.save();
      // Apply silhouette mask
      if (silhouette) {
        drawSilhouetteMask(silhouette);
      } else {
        drawPolygonMask(poly);
      }
      ctx.clip();

      // Rotate/scale the inner content to match the face's tilt and size
      ctx.translate(center[0], center[1]);
      ctx.rotate(angle);
      const innerFrame = getInnerFrame(Math.ceil(faceWidth), Math.ceil(faceHeight), t);
      ctx.drawImage(innerFrame, -faceWidth / 2, -faceHeight / 2, faceWidth, faceHeight);
      ctx.restore();

      // Viewfinder overlay: outline the face silhouette only
      if (silhouette) {
        ctx.strokeStyle = '#52e0c4';
        ctx.lineWidth = 2;
        drawSilhouetteMask(silhouette);
        ctx.stroke();
      }

      const ratio = polygonArea(poly) / (W * H);
      return ratio;
    }

    function onResults(results) {
      const t = (performance.now() - t0) / 1000;

      // Feed is drawn every frame in processCameraFrame; only composite overlay here.
      if (!trackingActive) return;

      drawWebcamFrame();

      let targetPoints = null;
      let currentSilhouette = null;
      currentFaceTransform = null;

      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        // mirrorCanvas was already flipped before being sent to MediaPipe, so
        // these landmark x/y map directly onto the canvas — no extra mirroring.
        const lms = results.multiFaceLandmarks[0];
        currentFaceTransform = getFaceFrameCorners(lms, W, H);
        targetPoints = currentFaceTransform.corners;
        currentSilhouette = FACE_OUTLINE.map(idx => [lms[idx].x * W, lms[idx].y * H]);
        faceLostTime = 0;
      } else {
        if (faceLostTime === 0) faceLostTime = performance.now();
        if (performance.now() - faceLostTime < RECOVERY_TIMEOUT) {
          targetPoints = smoothed;
          currentFaceTransform = lastFaceTransform;
          currentSilhouette = lastSilhouette;
        }
      }

      if (targetPoints) {
        if (!smoothed) smoothed = targetPoints;
        else smoothed = lerpPolygon(smoothed, targetPoints, 0.35);

        if (currentFaceTransform) lastFaceTransform = currentFaceTransform;
        if (currentSilhouette) lastSilhouette = currentSilhouette;

        const polyData = currentFaceTransform || lastFaceTransform;
        polyData.corners = smoothed;
        compositeFrame(polyData, currentSilhouette || lastSilhouette, t);
        setStatus('Face tracked');
      } else {
        smoothed = null;
        currentFaceTransform = null;
        lastFaceTransform = null;
        lastSilhouette = null;
        drawCanvasHint('Show your face to the camera');
        setStatus('Camera on — show your face');
      }
    }

    if (faceMesh) faceMesh.onResults(onResults);

    // --- startup hints ---
    if (!isSecureContext()) {
      setStatus('Open via http://localhost:8080/ui.html (not file://)');
      drawCanvasHint('Use a local server, then click Start Camera');
    } else if (faceMesh) {
      setStatus('Click Start Camera');
      drawCanvasHint('Click Start Camera below');
    } else {
      drawCanvasHint('Tracking failed to load — check internet');
    }
  </script>
</body>
</html>
